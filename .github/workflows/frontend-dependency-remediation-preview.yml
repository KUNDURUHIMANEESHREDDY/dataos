name: Frontend dependency remediation candidate

on:
  push:
    branches:
      - automation/frontend-dependency-remediation-no-exa-20261030

permissions:
  contents: read

jobs:
  preview:
    name: Generate and verify dependency remediation proposal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Regenerate lockfile after removing unused SDK
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Install proposed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Apply non-breaking audit fixes
        run: npm audit fix --no-fund
        continue-on-error: true
      - name: Reinstall remediated dependency graph
        run: npm ci --no-audit --no-fund
      - name: Audit remediated frontend dependencies
        id: audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Test bounded API pagination
        run: node --test tests/dataspace-pagination.test.mjs
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Build production frontend
        run: npm run build
      - name: Upload proposed manifest, lockfile and audit evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4.6.2
        with:
          name: frontend-dependency-remediation-no-exa
          path: |
            package.json
            package-lock.json
            npm-audit.json
          if-no-files-found: error
      - name: Fail if high or critical vulnerabilities remain
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'npm audit outcome: %s\\n' "$AUDIT_OUTCOME"
          test "$AUDIT_OUTCOME" = "success"
