name: Rust authorization tests

on:
  pull_request:
    paths:
      - "rust-backend/**"
      - ".github/workflows/rust-authorization.yml"
  push:
    branches:
      - "fix/resource-level-authorization"
    paths:
      - "rust-backend/**"
      - ".github/workflows/rust-authorization.yml"

permissions:
  contents: read

concurrency:
  group: rust-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-authorization:
    name: Rust tests and release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version
      - name: Verify lockfile, run tests, and build release binary
        working-directory: rust-backend
        run: |
          cargo test --locked
          cargo build --release --locked
