name: DataOS frontend verification

on:
  push:
    branches:
      - main
      - fix/dataspace-relationship-pagination-20261030
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataos-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend dependency audit, pagination tests, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install reviewed frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Test bounded API pagination
        run: node --test tests/dataspace-pagination.test.mjs
      - name: Typecheck frontend
        run: npx tsc --noEmit
      - name: Build production frontend
        run: npm run build

  frontend-required:
    name: Frontend required
    if: always()
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless frontend verification passed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Frontend result: %s\\n' "$FRONTEND_RESULT"
          test "$FRONTEND_RESULT" = "success"
