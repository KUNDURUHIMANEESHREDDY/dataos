name: DataOS verification

on:
  push:
    branches: [main, production-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: dataos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow YAML integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Reject invalid YAML and duplicate mapping keys
        run: python scripts/check_workflow_yaml.py
      - name: Test duplicate-key and fail-closed gate regressions
        run: python -m unittest scripts.test_check_workflow_yaml -v

  backend:
    name: Backend correctness and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run correctness suite
        run: |
          mkdir -p test-results
          python -m pytest tests/ --ignore=tests/test_benchmarks.py --junitxml=test-results/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dataos-pytest-${{ github.run_id }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Run end-to-end scenario
        run: python scenario_demo.py
      - name: Smoke-test CLI health
        run: python -m cli health

  rust-backend:
    name: Rust authorization tests and release build
    uses: ./.github/workflows/rust-authorization.yml

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Production build
        run: npm run build

  postgres-storage:
    name: Live PostgreSQL storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataos
          # This PostgreSQL service is isolated to one ephemeral CI job; trust avoids
          # embedding a predictable pseudo-secret in the workflow or connection URL.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: dataos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataos -d dataos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATAOS_TEST_POSTGRES_URL: postgresql://dataos@localhost:5432/dataos_test
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install PostgreSQL dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest psycopg2-binary
      - name: Verify PostgreSQL backend parity
        run: python -m pytest tests/test_postgres_storage_integration.py -q

  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Go for the pinned Gitleaks CLI
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24.2"
          cache: false
      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan Git history with Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            gitleaks detect --source . --redact --exit-code 2 --report-format sarif --report-path results.sarif --log-opts="--no-merges --first-parent ${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks detect --source . --redact --exit-code 2 --report-format sarif --report-path results.sarif
          fi
      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: results.sarif

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt

  sbom:
    name: Generate Python dependency SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install CycloneDX tooling
        run: python -m pip install --upgrade pip cyclonedx-bom
      - name: Generate requirements SBOM
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dataos-python-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: Python CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  rust-codeql:
    name: Rust CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize Rust CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: rust
          build-mode: none
      - name: Analyze Rust
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

  security-required:
    name: security-required
    if: always()
    needs: [secret-scan, dependency-audit, sbom, codeql, rust-codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed on any security failure
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RUST_CODEQL_RESULT: ${{ needs.rust-codeql.result }}
        run: |
          set -euo pipefail
          echo "secret-scan: $SECRET_SCAN_RESULT"
          echo "dependency-audit: $DEPENDENCY_AUDIT_RESULT"
          echo "sbom: $SBOM_RESULT"
          echo "codeql: $CODEQL_RESULT"
          echo "rust-codeql: $RUST_CODEQL_RESULT"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$SBOM_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"
          test "$RUST_CODEQL_RESULT" = "success"

      - name: Fail on open critical/high code-scanning alerts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ref = context.eventName === "pull_request"
              ? `refs/pull/${context.payload.pull_request.number}/merge`
              : context.ref;
            const alerts = await github.paginate(
              github.rest.codeScanning.listAlertsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                ref,
                per_page: 100
              }
            );
            const blocking = alerts.filter(({ rule }) =>
              ["critical", "high"].includes(rule?.security_severity_level)
            );
            core.info(`Open critical/high code-scanning alerts on ${ref}: ${blocking.length}`);
            for (const alert of blocking) {
              const location = alert.most_recent_instance?.location;
              const where = location?.path
                ? `${location.path}:${location.start_line ?? "?"}`
                : "location unavailable";
              core.error(`#${alert.number} ${alert.rule?.security_severity_level}: ${alert.rule?.id} at ${where}`);
            }
            if (blocking.length > 0) {
              core.setFailed("Open critical/high code-scanning alerts must be triaged and remediated before release.");
            } else {
              core.info("No open critical/high code-scanning alerts were found.");
            }

  backend-required:
    name: Backend required
    if: always()
    needs: [backend, rust-backend, postgres-storage, security-required, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless backend, PostgreSQL, security, and workflow verification passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          RUST_BACKEND_RESULT: ${{ needs.rust-backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres-storage.result }}
          SECURITY_RESULT: ${{ needs.security-required.result }}
          WORKFLOW_LINT_RESULT: ${{ needs.workflow-lint.result }}
        run: |
          set -euo pipefail
          echo "backend: $BACKEND_RESULT"
          echo "rust-backend: $RUST_BACKEND_RESULT"
          echo "postgres-storage: $POSTGRES_RESULT"
          echo "security-required: $SECURITY_RESULT"
          echo "workflow-lint: $WORKFLOW_LINT_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$RUST_BACKEND_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          test "$WORKFLOW_LINT_RESULT" = "success"


