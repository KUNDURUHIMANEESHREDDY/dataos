name: DataOS backend verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataos-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend correctness and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run correctness suite
        run: |
          mkdir -p test-results
          python -m pytest tests/ --ignore=tests/test_benchmarks.py --junitxml=test-results/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataos-pytest-${{ github.run_id }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Run end-to-end scenario
        run: python scenario_demo.py
      - name: Smoke-test CLI health
        run: python -m cli health

  backend-required:
    name: Backend required
    if: always()
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed unless backend verification passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          if [ "$BACKEND_RESULT" != "success" ]; then
            echo "::error::Backend verification result was $BACKEND_RESULT"
            exit 1
          fi
          echo "Backend correctness and smoke tests passed."
