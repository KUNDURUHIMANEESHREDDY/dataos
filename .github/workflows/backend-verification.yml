name: DataOS backend verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dataos-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend correctness and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run correctness suite
        run: |
          mkdir -p test-results
          python -m pytest tests/ --ignore=tests/test_benchmarks.py --junitxml=test-results/junit.xml
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataos-pytest-${{ github.run_id }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Run end-to-end scenario
        run: python scenario_demo.py
      - name: Smoke-test CLI health
        run: python -m cli health

  postgres-storage:
    name: Live PostgreSQL storage contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dataos
          POSTGRES_PASSWORD: dataos-test-password
          POSTGRES_DB: dataos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataos -d dataos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATAOS_TEST_POSTGRES_URL: postgresql://dataos:dataos-test-password@localhost:5432/dataos_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install PostgreSQL test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest psycopg2-binary
      - name: Verify additive migration and object deletion against live PostgreSQL
        run: python -m pytest tests/test_postgres_storage_integration.py -q

  secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared dependencies
        run: pip-audit -r requirements.txt

  sbom:
    name: Generate Python dependency SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CycloneDX tooling
        run: python -m pip install --upgrade pip cyclonedx-bom
      - name: Generate requirements SBOM
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: dataos-python-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: Python CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  security-required:
    name: security-required
    if: always()
    needs: [secret-scan, dependency-audit, sbom, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Fail closed on any security workflow failure
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SBOM_RESULT: ${{ needs.sbom.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          echo "secret-scan: $SECRET_SCAN_RESULT"
          echo "dependency-audit: $DEPENDENCY_AUDIT_RESULT"
          echo "sbom: $SBOM_RESULT"
          echo "codeql: $CODEQL_RESULT"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$SBOM_RESULT" = "success"
          test "$CODEQL_RESULT" = "success"

      - name: Fail on open critical/high code-scanning alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100"
          fetch_alerts() {
            local ref="$1"
            gh api --paginate --jq '
              .[]
              | select(.state == "open" and
                  ((.rule.security_severity_level // "") == "critical" or
                   (.rule.security_severity_level // "") == "high"))
              | [
                  (.rule.security_severity_level // "unknown"),
                  (.rule.id // "unknown"),
                  (.most_recent_instance.location.path // "unknown"),
                  ((.most_recent_instance.location.start_line // 0) | tostring)
                ]
              | @tsv
            ' "${endpoint}&ref=${ref}"
          }
          count_lines() {
            if [[ -n "$1" ]]; then
              printf '%s\n' "$1" | sed '/^$/d' | wc -l | tr -d ' '
            else
              printf '0'
            fi
          }
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_ref="refs/heads/${GITHUB_BASE_REF}"
            head_ref="refs/heads/${GITHUB_HEAD_REF}"
            base_alerts="$(fetch_alerts "$base_ref" | sort -u)"
            head_alerts="$(fetch_alerts "$head_ref" | sort -u)"
            base_count="$(count_lines "$base_alerts")"
            head_count="$(count_lines "$head_alerts")"
            new_alerts="$(comm -13 <(printf '%s\n' "$base_alerts" | sed '/^$/d') <(printf '%s\n' "$head_alerts" | sed '/^$/d'))"
            echo "Base critical/high alerts: $base_count"
            echo "PR-head critical/high alerts: $head_count"
            if [[ -n "$new_alerts" ]]; then
              echo "New critical/high alerts introduced by this PR (severity, rule, path, line):"
              printf '%s\n' "$new_alerts"
              echo "::error::This PR introduces critical/high code-scanning alerts."
              exit 1
            fi
            echo "No new critical/high alerts versus base. Main-branch gate remains fail-closed until the total reaches zero."
          else
            alerts="$(fetch_alerts "refs/heads/${GITHUB_REF_NAME}" | sort -u)"
            count="$(count_lines "$alerts")"
            echo "Open critical/high code-scanning alerts on ${GITHUB_REF_NAME}: $count"
            if [[ "$count" != "0" ]]; then
              echo "Open alerts (severity, rule, path, line):"
              printf '%s\n' "$alerts"
              echo "::error::Found $count open critical/high code-scanning alert(s); triage and remediate before release."
              exit 1
            fi
          fi

  backend-required:
    name: Backend required
    if: always()
    needs: [backend, postgres-storage, security-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed unless backend, PostgreSQL, and security verification passed
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          POSTGRES_RESULT: ${{ needs.postgres-storage.result }}
          SECURITY_RESULT: ${{ needs.security-required.result }}
        run: |
          set -euo pipefail
          echo "backend: $BACKEND_RESULT"
          echo "postgres-storage: $POSTGRES_RESULT"
          echo "security-required: $SECURITY_RESULT"
          test "$BACKEND_RESULT" = "success"
          test "$POSTGRES_RESULT" = "success"
          test "$SECURITY_RESULT" = "success"
          echo "Backend, live PostgreSQL, and security verification passed."
